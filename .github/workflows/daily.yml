name: daily-scan

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

concurrency:
  group: daily-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install earthengine-api shapely

      - name: Write service account key
        env:
          GEE_KEY: ${{ secrets.GEE_KEY }}
        run: printf '%s' "$GEE_KEY" > gee-key.json

      - name: Run pipeline
        env:
          GEE_SERVICE_ACCOUNT: ${{ secrets.GEE_SERVICE_ACCOUNT }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python run.py

      - name: Remove key
        if: always()
        run: rm -f gee-key.json

      - name: Commit results
        run: |
          git config user.name "scan-bot"
          git config user.email "actions@github.com"
          git add candidates candidates_filtered candidates_final events.csv events.geojson exclusion.geojson gates_report.csv brightness_report.csv brightness_detail.csv || true
          git diff --staged --quiet || git commit -m "daily scan $(date -u +%F)"
          git push
